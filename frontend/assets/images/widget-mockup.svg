<svg width="1080" height="1920" viewBox="0 0 1080 1920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wallpaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5E9DA"/>
      <stop offset="100%" stop-color="#EADBC8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#8B5E3C" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Phone background -->
  <rect x="60" y="40" width="960" height="1840" rx="64" fill="url(#wallpaper)"/>

  <!-- Status bar -->
  <rect x="120" y="90" width="840" height="30" rx="15" fill="rgba(0,0,0,0.08)"/>

  <!-- Home screen grid hint -->
  <g opacity="0.12">
    <circle cx="190" cy="210" r="2" fill="#8B5E3C"/>
    <circle cx="330" cy="210" r="2" fill="#8B5E3C"/>
    <circle cx="470" cy="210" r="2" fill="#8B5E3C"/>
    <circle cx="610" cy="210" r="2" fill="#8B5E3C"/>
    <circle cx="750" cy="210" r="2" fill="#8B5E3C"/>
    <circle cx="890" cy="210" r="2" fill="#8B5E3C"/>
  </g>

  <!-- Sticky note widgets -->
  <g filter="url(#softShadow)">
    <!-- High priority 2x2 -->
    <g transform="translate(140 260) rotate(-2 220 220)">
      <rect x="0" y="0" width="440" height="440" rx="28" fill="rgba(243,227,179,0.92)"/>
      <circle cx="220" cy="24" r="10" fill="#D97A5F"/>
      <text x="220" y="160" font-family="Arial" font-size="36" font-weight="700" fill="#8B5E3C" text-anchor="middle">Launch demo</text>
      <text x="220" y="210" font-family="Arial" font-size="24" fill="#8B5E3C" text-anchor="middle" opacity="0.7">Due tomorrow</text>
    </g>

    <!-- Medium priority 2x1 -->
    <g transform="translate(140 740) rotate(1 220 110)">
      <rect x="0" y="0" width="440" height="220" rx="24" fill="rgba(220,232,213,0.92)"/>
      <circle cx="220" cy="20" r="9" fill="#7A9E7E"/>
      <text x="220" y="120" font-family="Arial" font-size="28" font-weight="700" fill="#8B5E3C" text-anchor="middle">Read 10 pages</text>
    </g>

    <!-- Low priority 1x1 -->
    <g transform="translate(640 740) rotate(-1 110 110)">
      <rect x="0" y="0" width="220" height="220" rx="22" fill="rgba(217,230,236,0.92)"/>
      <circle cx="110" cy="18" r="8" fill="#7C9FB0"/>
      <text x="110" y="125" font-family="Arial" font-size="22" font-weight="700" fill="#8B5E3C" text-anchor="middle">Water</text>
    </g>
  </g>

  <!-- Dock icons -->
  <rect x="220" y="1660" width="640" height="90" rx="28" fill="rgba(0,0,0,0.06)"/>
  <circle cx="350" cy="1705" r="18" fill="#D97A5F"/>
  <circle cx="540" cy="1705" r="18" fill="#7C9FB0"/>
  <circle cx="730" cy="1705" r="18" fill="#8B5E3C"/>
</svg>
